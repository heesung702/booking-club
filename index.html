<style>
/* Layout: one full-screen 3D festival scene at dusk; a thin HUD floats on top (ID and toggles above, four dance buttons below). Single dusk look by choice. */
:root{
  color-scheme: dark;
  --bg:#1a1b4b;
  --panel:rgba(30,24,66,.8);
  --line:rgba(255,255,255,.2);
  --fg:#fff8f0;
  --muted:#d6cbe8;
  --suit:#ffd400;
  --ink:#231a3d;
  --m1:#7fe7ff; --m2:#ff8fc7; --m3:#a8f59a; --m4:#ffb469; --m5:#c9a8ff; --m6:#ff9d9d;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;word-break:keep-all;touch-action:manipulation;-webkit-user-select:none;user-select:none}
canvas#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:14px;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--suit);outline-offset:2px}

.hud{position:fixed;left:0;right:0;display:flex;gap:8px;align-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.hud > *{pointer-events:auto}
.hud.top{top:0;padding-block:calc(env(safe-area-inset-top,0px) + 12px) 0;justify-content:space-between}
.hud.bottom{bottom:0;padding-block:0 calc(env(safe-area-inset-bottom,0px) + 14px);flex-direction:column;align-items:stretch}
.me{background:var(--suit);color:var(--ink);font-weight:800;padding:8px 12px;border-radius:999px;font-size:14px;max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{display:flex;gap:8px}
.tools{flex-wrap:nowrap}
.tools button{padding:8px 9px;font-size:12.5px;font-weight:700;min-height:38px;white-space:nowrap}
.tools button[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.moves{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;max-width:760px;width:100%;margin-inline:auto}
.moves button{padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;border-width:2px;border-color:var(--c)}
.moves button .k{font-size:11px;color:var(--muted);font-weight:700}
.moves button .n{font-size:16px;font-weight:800;white-space:nowrap}
@media (max-width:560px){.moves{grid-template-columns:repeat(3,minmax(0,1fr))}.moves button{padding:7px 4px 6px}}
.moves button[aria-pressed="true"]{background:var(--c);color:var(--ink)}
.moves button[aria-pressed="true"] .k{color:var(--ink)}
.reacts{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
.reacts button{padding:8px 14px;font-weight:800;font-size:14px;border-radius:999px;min-height:40px;display:flex;gap:6px;align-items:center}
.reacts button .k{font-size:11px;color:var(--muted);font-weight:700}
.reacts button:active{transform:scale(.94)}
.hint{min-width:0;max-width:100%;overflow-wrap:anywhere;line-height:1.5;text-align:center;font-size:12px;color:var(--fg);margin-bottom:8px;text-shadow:0 1px 6px rgba(20,10,50,.9)}
.who{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 52px);background:var(--panel);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;pointer-events:none}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%);padding:8px 16px;border-radius:999px;
  font-weight:900;font-size:18px;color:var(--ink);background:var(--suit);box-shadow:0 0 24px rgba(255,212,0,.7);white-space:nowrap;pointer-events:none}

.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(rgba(26,27,75,.35),rgba(26,27,75,.8));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:100%;max-width:360px;text-align:center;display:flex;flex-direction:column;gap:16px}
.card h1{margin:0;font-size:44px;line-height:1.05;font-weight:900;letter-spacing:-.02em;color:var(--suit);text-wrap:balance;text-shadow:0 2px 18px rgba(20,10,50,.8)}
.card p{margin:0;color:var(--fg);font-size:14px;line-height:1.6;text-shadow:0 1px 8px rgba(20,10,50,.9)}
.idrow{display:flex;gap:8px;align-items:stretch}
.idbox{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:18px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idrow button{padding:0 14px;font-weight:700;font-size:14px;white-space:nowrap}
.places{display:flex;gap:8px}
.places button{flex:1;padding:12px 8px;font-weight:800;font-size:15px}
.places button[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
#fade{position:fixed;inset:0;background:#0a1a3a;opacity:0;pointer-events:none;transition:opacity .45s}
#fade.on{opacity:1}
.enter{background:var(--suit);color:var(--ink);border:0;font-size:20px;font-weight:900;padding:16px;border-radius:16px}
.enter:active{transform:scale(.98)}
</style>

<canvas id="stage"></canvas>
<div id="fade"></div>

<div class="hud top" id="hudTop" hidden>
  <div class="me" id="meTag"></div>
  <div class="tools">
    <button id="btnPlace">장소 이동</button>
    <button id="btnWatch" aria-pressed="false">구경 모드</button>
    <button id="btnSound" aria-pressed="false">소리 끄기</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="who" id="who" hidden></div>

<div class="hud bottom" id="hudBottom" hidden>
  <div class="reacts">
    <button id="rc1"><span aria-hidden="true">👏</span>박수<span class="k">Q</span></button>
    <button id="rc2"><span aria-hidden="true">👍</span>따봉<span class="k">E</span></button>
    <button id="rc3">쉬기<span class="k">R</span></button>
  </div>
  <div class="hint" id="hint">바닥을 누르거나 방향키(WASD)로 걸어가요. 계속 추고 있으면 지나가던 친구가 함께 출 수도 있어요.</div>
  <div class="moves">
    <button id="mv1" style="--c:var(--m1)" aria-pressed="false"><span class="k">1</span><span class="n">통통</span></button>
    <button id="mv2" style="--c:var(--m2)" aria-pressed="false"><span class="k">2</span><span class="n">만세</span></button>
    <button id="mv3" style="--c:var(--m3)" aria-pressed="false"><span class="k">3</span><span class="n">씰룩</span></button>
    <button id="mv4" style="--c:var(--m4)" aria-pressed="false"><span class="k">4</span><span class="n">콩콩</span></button>
    <button id="mv5" style="--c:var(--m5)" aria-pressed="false"><span class="k">5</span><span class="n">말타기</span></button>
    <button id="mv6" style="--c:var(--m6)" aria-pressed="false"><span class="k">6</span><span class="n">콕콕 찌르기</span></button>
  </div>
</div>

<div class="gate" id="gate">
  <div class="card">
    <h1>부킹 클럽</h1>
    <p>오늘은 어디서 출까요? 말은 필요 없어요. 음악을 듣고, 춤추고, 구경하세요.</p>
    <div class="places" role="group" aria-label="장소">
      <button id="pl0" aria-pressed="true">노을 페스티벌</button>
      <button id="pl1" aria-pressed="false">바닷속</button>
    </div>
    <div class="idrow">
      <div class="idbox" id="idBox" aria-live="polite"></div>
      <button id="btnReroll">다시 뽑기</button>
    </div>
    <button class="enter" id="btnEnter">입장하기</button>
    <p>입장하면 음악이 나와요. 같은 방 사람들과 같은 박자로 춰요. 사람이 적을 땐 컴퓨터 댄서가 함께 춰요.</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);

/* ---------- ID ---------- */
const ADJ = ['신난','졸린','배고픈','수줍은','용감한','느긋한','반짝이는','엉뚱한','씩씩한','말랑한','날쌘','든든한'];
const ANI = ['수달','너구리','펭귄','고양이','다람쥐','문어','판다','오리','거북이','여우','햄스터','고래'];
const pick = a => a[Math.floor(Math.random()*a.length)];
const makeId = () => pick(ADJ) + pick(ANI) + (10 + Math.floor(Math.random()*90));
let myId = makeId();
$('idBox').textContent = myId;
$('btnReroll').addEventListener('click', () => { myId = makeId(); $('idBox').textContent = myId; });

/* ---------- Music: every sound is synthesized here, no audio files ---------- */
const BPM = 122, BEAT = 60/BPM, STEP = BEAT/4;
let ctx = null, t0 = 0, nextStep = 0, master = null, bus = null, noiseBuf = null, muted = false;
// One shared clock for everyone: the beat comes from the server's time, so music and dances line up on every screen (that is what makes 떼춤 work).
const EPOCH = Date.UTC(2026, 0, 1), perfBase = Date.now() - performance.now();
let clockOffset = 0;
const gsec = () => (performance.now() + perfBase + clockOffset - EPOCH)/1000;
function beatNow(){
  if (ctx && ctx.state === 'running') return (ctx.currentTime - t0)/BEAT;
  return gsec()/BEAT;
}
function syncAudio(force){
  if (!ctx || ctx.state !== 'running') return;
  const want = ctx.currentTime - gsec();
  if (!force && Math.abs(want - t0) < 0.04) return;
  t0 = want; nextStep = Math.ceil((ctx.currentTime + 0.05 - t0)/STEP);
}
const hz = m => 440*Math.pow(2,(m-69)/12);
// Three moods take turns, 32 bars each (about a minute in this prototype): sunset, night, neon midnight. Each has its own chords, melody and sound.
const MOOD_BARS = 32;
const SONGS = [
  {ch:[[57,60,64],[53,57,60],[55,60,64],[55,59,62]], rt:[45,41,48,43], ld:[[76,0,0,74,0,0,72,0,69,0,0,72,0,0,74,0],[76,0,0,74,0,0,72,0,67,0,0,69,0,0,0,0]], st:[0,3,6,10], wave:'triangle', lg:0.11, cut:2400},
  {ch:[[53,57,60],[55,59,62],[52,55,59],[57,60,64]], rt:[41,43,40,45], ld:[[72,0,0,0,76,0,0,0,74,0,0,0,71,0,72,0],[69,0,0,0,72,0,0,0,71,0,67,0,69,0,0,0]], st:[0,6,12], wave:'sine', lg:0.14, cut:1500},
  {ch:[[62,65,69],[58,62,65],[57,60,65],[55,60,64]], rt:[50,46,41,48], ld:[[77,0,74,0,0,72,0,74,0,0,77,0,74,0,0,0],[76,0,72,0,0,67,0,72,0,0,76,0,72,0,67,0]], st:[0,3,6,8,11,14], wave:'square', lg:0.045, cut:3000}
];
const SECTIONS = [{k:1,h:1,b:1,s:1},{k:1,h:1,b:1,c:1,s:1,l:1},{k:1,h:1,b:1,c:1,s:1,l:1,sh:1},{h:1,s:1,l:1,r:1}];
function env(g, t, peak, dur){ g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.0008, t+dur); }
function noise(t, dur, type, freq, peak, q){
  const s = ctx.createBufferSource(); s.buffer = noiseBuf;
  const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; if (q) f.Q.value = q;
  const g = ctx.createGain(); env(g, t, peak, dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random()*0.5); s.stop(t+dur+0.02);
}
function kick(t){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.setValueAtTime(165, t); o.frequency.exponentialRampToValueAtTime(48, t+0.11);
  env(g, t, 0.95, 0.32); o.connect(g); g.connect(master); o.start(t); o.stop(t+0.34);
  bus.gain.cancelScheduledValues(t); bus.gain.setValueAtTime(0.35, t); bus.gain.linearRampToValueAtTime(1, t+0.24);
}
function tone(t, type, freq, peak, dur, cutFrom, cutTo){
  const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.value = freq; env(g, t, peak, dur);
  if (cutFrom){
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutFrom, t); f.frequency.exponentialRampToValueAtTime(cutTo, t+dur);
    o.connect(f); f.connect(g);
  } else o.connect(g);
  g.connect(bus); o.start(t); o.stop(t+dur+0.02);
}
function riser(t, dur){
  const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
  f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(7000, t+dur);
  const g = ctx.createGain(); g.gain.setValueAtTime(0.0008, t); g.gain.exponentialRampToValueAtTime(0.2, t+dur); g.gain.linearRampToValueAtTime(0, t+dur+0.05);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur+0.1);
}
function playStep(n, t){
  const s = n % 16, bar = Math.floor(n/16), song = SONGS[Math.floor(bar/MOOD_BARS) % 3], L = SECTIONS[Math.floor((bar % MOOD_BARS)/8)], ci = bar % 4;
  if (L.k && s % 4 === 0) kick(t);
  if (L.h && s % 4 === 2) noise(t, 0.05, 'highpass', 8000, 0.22);
  if (L.sh && s % 2 === 1) noise(t, 0.03, 'highpass', 9500, 0.07);
  if (L.c && (s === 4 || s === 12)) noise(t, 0.16, 'bandpass', 1400, 0.42, 0.8);
  if (L.b && (s % 4 === 2 || s === 15)) tone(t, 'sawtooth', hz(song.rt[ci]), 0.3, STEP*1.9, 900, 280);
  if (L.s && song.st.indexOf(s) >= 0) song.ch[ci].forEach((m, i) => tone(t, 'sawtooth', hz(m)*(1 + (i-1)*0.003), 0.07, 0.24, song.cut, 700));
  if (L.l){ const m = song.ld[bar % 2][s]; if (m) tone(t, song.wave, hz(m), song.lg, 0.28); }
  if (L.r && bar % 8 === 6 && s === 0) riser(t, BEAT*8);
}
let lastSync = 0;
function schedule(){
  if (!ctx || ctx.state !== 'running') return;
  if (ctx.currentTime - lastSync > 4){ lastSync = ctx.currentTime; syncAudio(false); }
  while (t0 + nextStep*STEP < ctx.currentTime + 0.14){
    const t = t0 + nextStep*STEP;
    if (t > ctx.currentTime - 0.03) playStep(nextStep, Math.max(t, ctx.currentTime));
    nextStep++;
  }
}
function startAudio(){
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  ctx = new AC();
  master = ctx.createGain(); master.gain.value = 0.8;
  const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
  bus = ctx.createGain(); bus.connect(master);
  noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
  syncAudio(true);
  const p = ctx.resume ? ctx.resume() : null; if (p && p.then) p.then(() => syncAudio(true), () => {});
  setInterval(schedule, 25);
}
document.addEventListener('visibilitychange', () => {
  if (!ctx) return;
  if (document.hidden) ctx.suspend(); else { const p = ctx.resume(); if (p && p.then) p.then(() => syncAudio(true), () => {}); }
});

/* ---------- Scene: an open-air festival field at dusk ---------- */
if (!window.THREE){ $('gate').querySelector('p').textContent = '3D 화면을 불러오지 못했어요. 새로고침해 주세요.'; return; }
const canvas = $('stage');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x8a5a9e, 40, 130);
const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 220);
let portrait = false, placeId = 0;
function resize(){
  const w = window.innerWidth, h = window.innerHeight; portrait = w < h;
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.fov = portrait ? 58 : 46; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();
const rnd = (() => { let s = 7; return () => { s = (s*16807) % 2147483647; return s/2147483647; }; })();
const MAT_POS = [[-13.4,3.8],[13.4,3.8],[-14.9,-3.1],[14.9,-3.1],[-10.3,9.8],[10.3,9.8]];
const basic = (c, o) => new THREE.MeshBasicMaterial(Object.assign({color:c}, o || {}));
const lamb = c => new THREE.MeshLambertMaterial({color:c});
function softDot(){
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
}
const dotTex = softDot();

const festival = new THREE.Group(); scene.add(festival);
// Sky: one gradient per mood, cross-faded slowly
const SKY_STOPS = [
  [[0,'#10163f'],[0.26,'#2a2a70'],[0.39,'#6b4a9c'],[0.455,'#d9779f'],[0.492,'#ffb27a'],[0.5,'#ffd9a0'],[1,'#ffd9a0']],
  [[0,'#050a2a'],[0.3,'#0d1a4f'],[0.44,'#1f3a7a'],[0.492,'#3f6aa8'],[0.5,'#5f8fc0'],[1,'#5f8fc0']],
  [[0,'#12062e'],[0.28,'#3a0f6a'],[0.42,'#8a2aa0'],[0.485,'#ff5fa8'],[0.5,'#ff9fd0'],[1,'#ff9fd0']]
];
const skies = []; let starMat = null;
(function(){
  SKY_STOPS.forEach((stops, i) => {
    const c = document.createElement('canvas'); c.width = 4; c.height = 512; const g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, 512); stops.forEach(s => gr.addColorStop(s[0], s[1]));
    g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
    const sky = new THREE.Mesh(new THREE.SphereGeometry(180 - i, 24, 24), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c), side:THREE.BackSide, fog:false, depthWrite:false, transparent:i > 0, opacity:i > 0 ? 0 : 1}));
    sky.renderOrder = -10 + i; festival.add(sky); skies.push(sky);
  });
  const sp = []; for (let i = 0; i < 260; i++){ const a = rnd()*Math.PI*2, e = 0.25 + rnd()*1.2; sp.push(Math.cos(a)*Math.cos(e)*170, Math.sin(e)*170, Math.sin(a)*Math.cos(e)*170); }
  const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  starMat = new THREE.PointsMaterial({color:0xfff4d6, size:1.5, map:dotTex, transparent:true, opacity:0.55, depthWrite:false, fog:false}); festival.add(new THREE.Points(sg, starMat));
  const moon = new THREE.Mesh(new THREE.CircleGeometry(7, 32), basic(0xfff3c4, {fog:false})); moon.position.set(48, 62, -140); moon.lookAt(0, 0, 0); festival.add(moon);
  const halo = new THREE.Mesh(new THREE.CircleGeometry(15, 32), basic(0xfff3c4, {fog:false, transparent:true, opacity:0.12, depthWrite:false})); halo.position.set(48.5, 62.5, -141); halo.lookAt(0, 0, 0); festival.add(halo);
})();
// Mountains
function mountains(radius, baseH, amp, color, seed){
  const pos = [], idx = [], n = 160;

const net = {ws:null, open:false, host:false, id:'', n:1, room:0, retry:0, timer:0, entered:false, sent:new Map(), last:0, pings:[]};
const remote = new Map();
const people = () => [player].concat([...remote.values()].filter(a => !a.bot));
const findAv = id => id === net.id ? player : remote.get(id) || bots.find(b => b.nid === id) || null;
function send(m){ if (net.ws && net.ws.readyState === 1) net.ws.send(JSON.stringify(m)); }
function showWho(){ const w = $('who'); w.hidden = !net.open; w.textContent = '함께 ' + net.n + '명 · ' + net.room + '번 방'; }

function connect(){
  if (!SERVER || !entered || net.ws) return;
  clearTimeout(net.timer);
  let ws; try { ws = new WebSocket(SERVER + '?place=' + placeId); } catch (e){ retry(); return; }
  net.ws = ws;
  ws.onopen = () => { ws.send(JSON.stringify({t:'hi', name:myId, v:myVariant, vid, enter:net.entered ? 0 : 1})); ping(); };
  ws.onmessage = e => { if (net.ws !== ws) return; let m; try { m = JSON.parse(e.data); } catch (err){ return; } onNet(m); };
  ws.onclose = () => { if (net.ws !== ws) return; net.ws = null; goSolo(); retry(); };
}
function retry(){ clearTimeout(net.timer); net.retry = Math.min(30000, (net.retry || 1000)*2); net.timer = setTimeout(connect, net.retry); }
function reconnect(){ const w = net.ws; net.ws = null; if (w) try { w.close(); } catch (e){} goSolo(); net.retry = 0; connect(); }
function ping(){ send({t:'p', c:performance.now()}); }
setInterval(() => { if (net.open) ping(); }, 25000);
document.addEventListener('visibilitychange', () => { if (net.open) send({t:document.hidden ? 'away' : 'back'}); });

// Back to dancing alone: everyone else disappears and the five computer dancers return.
function goSolo(){
  const was = net.open; net.open = false; net.host = false; net.id = ''; net.n = 1;
  remote.forEach(av => removeAvatar(av)); remote.clear();
  if (was || bots.length < 5) fillBots(5);
  showWho();
}
function spawnBot(){ const a = Math.random()*Math.PI*2, d = 2 + Math.random()*6.5; return addBot(Math.cos(a)*d, Math.sin(a)*d); }
function fillBots(want){ while (bots.length < want) spawnBot(); while (bots.length > want) removeAvatar(bots[bots.length - 1]); }
const botMsg = b => ({t:'b', op:'add', id:b.nid, name:b.name, v:b.variant, x:+b.root.position.x.toFixed(2), z:+b.root.position.z.toFixed(2), m:b.move});
// About six dancers in total: one person + five computer dancers, and they step out as more people arrive.
function balanceBots(){
  const want = Math.max(0, Math.min(5, 6 - net.n));
  if (bots.length < want){ const b = spawnBot(); send(botMsg(b)); }
  else if (bots.length > want){ const b = bots.find(o => !o.seat && o.mode === 'free') || bots[0]; send({t:'b', op:'del', id:b.nid}); net.sent.delete(b.nid); removeAvatar(b); }
}
function addRemote(p){
  if (!p || remote.has(p.id) || p.id === net.id) return null;
  const av = makeAvatar(p.name, p.v, false); av.nid = p.id; av.bot = !!p.bot; av.variant = p.v;
  place(av, p.x, p.z); av.face = av.home = 0; av.moveSince = -1e9; remote.set(p.id, av); applyState(av, p); return av;
}
function applyState(av, p){
  if (Math.hypot(av.root.position.x - p.x, av.root.position.z - p.z) > 4) place(av, p.x, p.z);
  av.target.set(p.tx, 0, p.tz); clampFloor(av.target);
  const st = p.seat >= 0 ? seats[p.seat] || null : null;
  if (st !== av.seat){ standUp(av); if (st && !st.by){ st.by = av; av.seat = st; av.item = placeId === 1 ? 0 : 1 + Math.floor(Math.random()*2); av.target.set(st.x, 0, st.z); } }
  av.pending = p.m !== av.move ? p.m : -1;
}
function snap(av){
  const p = av.root.position, r = v => Math.round(v*100)/100;
  return {x:r(p.x), z:r(p.z), tx:r(av.target.x), tz:r(av.target.z), m:av.pending >= 0 ? av.pending : av.move, seat:av.seat ? seats.indexOf(av.seat) : -1};
}
// Send only what changed, at most about seven times a second.
function netTick(now){
  if (!net.open || now - net.last < 150) return;
  const list = net.host ? [player].concat(bots) : [player];
  for (const av of list){
    const st = snap(av), k = st.tx + ',' + st.tz + ',' + st.m + ',' + st.seat;
    if (net.sent.get(av.nid) === k) continue;
    net.sent.set(av.nid, k); net.last = now;
    send(av === player ? Object.assign({t:'s'}, st) : Object.assign({t:'b', op:'s', id:av.nid}, st));
  }
}
function takeBots(list){
  // This screen now runs the computer dancers.
  list.forEach(p => {
    let av = remote.get(p.id);
    if (av){ remote.delete(p.id); av.mode = 'free'; av.home = (Math.random() - 0.5)*0.9; av.social = 0.6 + Math.random()*0.7; bots.push(av); }
    else { av = addBot(p.x, p.z, p.name, p.v, p.id, p.m); av.target.set(p.tx, 0, p.tz); }
  });
}
function onNet(m){
  if (m.t === 'p'){
    const now = performance.now(), rtt = now - m.c;
    net.pings.push({rtt, off:m.s + rtt/2 - (now + perfBase)}); if (net.pings.length > 6) net.pings.shift();
    const best = net.pings.reduce((a, b) => b.rtt < a.rtt ? b : a);
    const moved = Math.abs(best.off - clockOffset) > 30; clockOffset = best.off; if (moved) syncAudio(false);
    if (net.pings.length < 4) setTimeout(ping, 400);
  } else if (m.t === 'w'){
    net.open = true; net.retry = 0; net.entered = true; net.id = m.you.id; net.host = m.host; net.n = m.n; net.room = m.room; net.sent.clear();
    player.nid = m.you.id;
    remote.forEach(av => removeAvatar(av)); remote.clear();
    m.peers.forEach(addRemote);
    if (m.host){
      if (m.bots.length){ fillBots(0); takeBots(m.bots); }
      else { fillBots(Math.max(0, Math.min(5, 6 - net.n))); bots.forEach(b => send(botMsg(b))); }
    } else { fillBots(0); m.bots.forEach(addRemote); }
    showWho();
  } else if (m.t === 'j'){
    addRemote(m.p); if (m.n) net.n = m.n; showWho();
  } else if (m.t === 'l'){
    const av = remote.get(m.id); if (av){ remote.delete(m.id); removeAvatar(av); }
    if (m.n) net.n = m.n; showWho();
  } else if (m.t === 's'){
    const av = remote.get(m.id); if (av) applyState(av, m);
  } else if (m.t === 'r'){
    const a = findAv(m.id), b = findAv(m.to); if (!a || a === player) return;
    react(a, m.k, b, 1.7);
    if (b) setTimeout(() => react(b, 3, a, 1.8), 700);
  } else if (m.t === 'h'){
    net.host = true; takeBots(m.bots || []); net.sent.clear();
  } else if (m.t === 'h0'){
    // Someone else runs the computer dancers now; keep showing them as they are.
    net.host = false;
    bots.slice().forEach(b => { bots.splice(bots.indexOf(b), 1); b.bot = true; b.mode = 'free'; b.leader = null; remote.set(b.nid, b); });
  }
}

if (LOCAL) window.__bk = {avatars, bots, remote, net, player, beat:() => beatNow()}; // local testing only

/* ---------- Animation: soft squash-and-stretch bounces ---------- */
const TAU = Math.PI*2;
function angLerp(a, b, k){ let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return a + d*k; }
function animate(av, b, dt){
  const k = 1 - Math.exp(-(placeId === 1 ? 6 : 12)*dt), pos = av.root.position;
  const dx = av.target.x - pos.x, dz = av.target.z - pos.z, dist = Math.hypot(dx, dz);
  let sqy = 1, hop = 0, off = 0, lean = 0, tilt = 0, nod = 0, lax = 0, laz = -0.2, rax = 0, raz = 0.2, swing = 0, legz = 0, legx = 0, face = av.home;
  const f = b - Math.floor(b), dn = (1 + Math.cos(TAU*b))/2, up = Math.sin(Math.PI*f), s2 = Math.sin(Math.PI*b);
  if (dist > 0.06){
    const step = Math.min(dist, (placeId === 1 ? 1.8 : 2.6)*dt); pos.x += dx/dist*step; pos.z += dz/dist*step;
    face = Math.atan2(dx, dz); av.walkT += dt; swing = 0.7*Math.sin(av.walkT*11); lean = 0.09*Math.sin(av.walkT*11); tilt = -lean; hop = 0.04*Math.abs(Math.sin(av.walkT*11));
    lax = -swing*0.8; rax = swing*0.8;
  } else switch (av.move){
    case 1: sqy = 1 - 0.14*dn + 0.05*up; hop = 0.17*up; laz = -(0.45 + 0.6*up); raz = 0.45 + 0.6*up; tilt = 0.2*s2; nod = 0.08*dn; break;
    case 2: sqy = 1 - 0.08*dn + 0.03*up; hop = 0.06*up; laz = -2.25 + 0.38*s2; raz = 2.25 + 0.38*s2; lean = -0.12*s2; tilt = -0.16*s2; break;
    case 3: sqy = 1 - 0.07*dn; off = 0.36*s2; lean = 0.14*s2; tilt = -0.22*s2; lax = 0.75*s2; rax = -0.75*s2; laz = -0.4; raz = 0.4; hop = 0.05*up; break;
    case 4: { const right = Math.floor(b) % 2 === 0; sqy = 1 - 0.17*dn + 0.09*up; hop = 0.32*up;
      if (right){ raz = 0.5 + 2.0*up; laz = -0.55; tilt = -0.14; } else { laz = -(0.5 + 2.0*up); raz = 0.55; tilt = 0.14; } nod = -0.1*up; break; }
    case 5: { const lasso = Math.floor(b/4) % 2 === 1; sqy = 1 - 0.13*dn + 0.04*up; hop = 0.13*up; legz = 0.5; off = 0.1*s2; nod = 0.1*dn;
      lax = -1.1 + 0.3*dn; laz = 0.4; rax = lax; raz = -0.4;
      if (lasso){ raz = 2.35 + 0.25*Math.sin(TAU*b); rax = 0.45*Math.cos(TAU*b); } break; }
    case 6: { const side = Math.floor(b/2) % 2 === 0 ? 1 : -1; sqy = 1 - 0.11*dn + 0.03*up; hop = 0.07*up; legz = 0.22; lean = -0.13*side; tilt = -0.12*side;
      if (side > 0){ raz = 1.95 + 0.4*dn; laz = -0.75; lax = 0.3; } else { laz = -(1.95 + 0.4*dn); raz = 0.75; rax = 0.3; } break; }
    default: sqy = 1 - 0.03*dn; tilt = 0.06*s2;
  }
  if (av.react){
    const nowS = performance.now()/1000;
    if (nowS > av.reactEnd){ av.react = 0; av.bubble.visible = false; }
    else {
      const s = 0.72*Math.min(1, (nowS - av.reactStart)*7)*Math.min(1, (av.reactEnd - nowS)*5); av.bubble.scale.set(s, s, 1);
      if (dist <= 0.06 && av.react < 3){
        face = av.reactFace; off = 0; lean = 0; legz = 0; nod = 0; hop = 0.05*up; sqy = 1 - 0.06*dn; tilt = 0.1*s2;
        if (av.react === 1){ const c = (1 + Math.cos(2*TAU*b))/2; lax = rax = -1.25; laz = 0.2 + 0.4*c; raz = -(0.2 + 0.4*c); }
        else { rax = -1.9; raz = 0.25; lax = 0; laz = -0.3; }
      } else if (dist <= 0.06) hop += 0.1*up;
    }
  }
  const sitting = !!av.seat && dist <= 0.06;
  if (sitting){
    hop = -0.25; off = 0; lean = 0; legz = 0.14; legx = -1.45; swing = 0; sqy = 1 - 0.03*dn;
    if (!(av.react === 1 || av.react === 2)){
      face = Math.atan2(-pos.x, -pos.z); tilt = 0.08*s2; nod = 0.05*dn; lax = 0.35; laz = -0.5; rax = 0.35; raz = 0.5;
      if (av.item){ const cyc = (b/8 + av.ph) % 1, lift = cyc < 0.3 ? Math.sin(cyc/0.3*Math.PI) : 0; rax = -1.0 - 1.15*lift; raz = 0.1 - 0.3*lift; nod = 0.05*dn - 0.12*lift; }
    }
  }
  av.cup.visible = sitting && av.item === 1; av.burger.visible = sitting && av.item === 2;
  if (placeId === 1 && !sitting){ const ms = performance.now(); hop = hop*1.5 + 0.07 + 0.04*Math.sin(ms/900 + av.ph); lean += 0.07*Math.sin(ms/1300 + av.ph); }
  av.face = angLerp(av.face, face, 1 - Math.exp(-8*dt)); av.root.rotation.y = av.face;
  const sq = av.sq, wide = 1 + (1 - sqy)*0.65;
  sq.scale.y += (sqy - sq.scale.y)*k; sq.scale.x += (wide - sq.scale.x)*k; sq.scale.z = sq.scale.x;
  sq.position.y += (hop - sq.position.y)*k; sq.position.x += (off - sq.position.x)*k; sq.rotation.z += (lean - sq.rotation.z)*k;
  av.head.rotation.z += (tilt - av.head.rotation.z)*k; av.head.rotation.x += (nod - av.head.rotation.x)*k;
  av.legs[0].rotation.z += (-legz - av.legs[0].rotation.z)*k; av.legs[1].rotation.z += (legz - av.legs[1].rotation.z)*k;
  av.legs[0].rotation.x += (swing + legx - av.legs[0].rotation.x)*k; av.legs[1].rotation.x += (-swing + legx - av.legs[1].rotation.x)*k;
  av.arms[0].rotation.x += (lax - av.arms[0].rotation.x)*k; av.arms[0].rotation.z += (laz - av.arms[0].rotation.z)*k;
  av.arms[1].rotation.x += (rax - av.arms[1].rotation.x)*k; av.arms[1].rotation.z += (raz - av.arms[1].rotation.z)*k;
  const sh = 1 - sq.position.y*1.2; av.shadow.scale.set(sh, sh, 1);
  const want = av.group ? 0.5 + 0.12*dn : 0; av.ring.material.opacity += (want - av.ring.material.opacity)*k;
  if (av.group) av.ring.material.color.copy(MOVE_COL[av.group.move]);
}

/* ---------- Controls ---------- */
let entered = false, watching = false, lastBeat = -1;
const HINT = '바닥을 누르거나 방향키(WASD)로 걸어가요. 계속 추고 있으면 지나가던 친구가 함께 출 수도 있어요.';
const moveBtns = [1,2,3,4,5,6].map(i => $('mv' + i));
function setMove(m){
  if (!entered) return;
  if (watching) setWatching(false);
  if (player.seat){ standUp(player); player.target.copy(player.root.position); clampFloor(player.target); }
  const now = player.pending >= 0 ? player.pending : player.move;
  player.pending = now === m ? 0 : m;
  moveBtns.forEach((b, i) => b.setAttribute('aria-pressed', String(player.pending === i + 1)));
}
moveBtns.forEach((b, i) => b.addEventListener('click', () => setMove(i + 1)));
const KEY_DIR = {ArrowUp:[0,-1], KeyW:[0,-1], ArrowDown:[0,1], KeyS:[0,1], ArrowLeft:[-1,0], KeyA:[-1,0], ArrowRight:[1,0], KeyD:[1,0]}, held = new Set();
window.addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '6') setMove(Number(e.key));
  if (KEY_DIR[e.code] && entered){ held.add(e.code); e.preventDefault(); }
});
window.addEventListener('keyup', e => { held.delete(e.code); });
function playerReact(type){
  if (!entered) return;
  let best = null, bd = 1e9;
  avatars.forEach(o => { if (o === player || o.isDj) return; const d = o.root.position.distanceTo(player.root.position) - (o.move > 0 ? 3 : 0); if (d < bd){ bd = d; best = o; } });
  react(player, type, best, 1.7);
  if (best) setTimeout(() => react(best, 3, player, 1.8), 700);
}
function playerRest(){
  if (!entered) return; if (watching) setWatching(false);
  if (player.seat){ standUp(player); player.target.copy(player.root.position); clampFloor(player.target); return; }
  if (sitDown(player)) moveBtns.forEach(b => b.setAttribute('aria-pressed', 'false'));
}
$('rc3').addEventListener('click', playerRest);
$('rc1').addEventListener('click', () => playerReact(1)); $('rc2').addEventListener('click', () => playerReact(2));
window.addEventListener('keydown', e => { if (e.repeat) return; if (e.code === 'KeyQ') playerReact(1); if (e.code === 'KeyE') playerReact(2); if (e.code === 'KeyR') playerRest(); });
window.addEventListener('blur', () => held.clear());
function keyWalk(){
  if (!held.size || !entered || watching) return;
  let x = 0, z = 0; held.forEach(c => { x += KEY_DIR[c][0]; z += KEY_DIR[c][1]; });
  const d = Math.hypot(x, z); if (!d) return;
  if (player.seat) standUp(player);
  const p = player.root.position; player.target.set(p.x + x/d*0.7, 0, p.z + z/d*0.7); clampFloor(player.target);
}
function setWatching(on){
  watching = on; $('btnWatch').setAttribute('aria-pressed', String(on));
  $('hint').textContent = on ? '풍경을 구경 중이에요. 춤 버튼을 누르면 다시 돌아가요.' : HINT;
  if (on){ player.pending = 0; moveBtns.forEach(b => b.setAttribute('aria-pressed', 'false')); }
}
$('btnWatch').addEventListener('click', () => setWatching(!watching));
function setPlace(p){
  placeId = p; festival.visible = p === 0; sea.visible = p === 1; avBubbles.visible = p === 1;
  scene.fog.near = p === 1 ? 10 : 40; scene.fog.far = p === 1 ? 85 : 130;
  avatars.forEach(a => { a.helmet.visible = p === 1; if (p === 1) a.item = 0; else if (a.seat && !a.item) a.item = 1 + Math.floor(Math.random()*2); });
  $('pl0').setAttribute('aria-pressed', String(p === 0)); $('pl1').setAttribute('aria-pressed', String(p === 1));
}
function goPlace(p){ if (p === placeId) return; const f = $('fade'); f.classList.add('on'); setTimeout(() => { setPlace(p); if (entered) reconnect(); f.classList.remove('on'); }, 480); }
$('pl0').addEventListener('click', () => goPlace(0)); $('pl1').addEventListener('click', () => goPlace(1));
$('btnPlace').addEventListener('click', () => goPlace(placeId === 0 ? 1 : 0));
$('btnSound').addEventListener('click', () => {
  muted = !muted; if (master) master.gain.value = muted ? 0 : 0.8;
  $('btnSound').setAttribute('aria-pressed', String(muted)); $('btnSound').textContent = muted ? '소리 켜기' : '소리 끄기';
});
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
canvas.addEventListener('click', e => {
  if (!entered || watching) return;
  ptr.set(e.clientX/window.innerWidth*2 - 1, -(e.clientY/window.innerHeight)*2 + 1); ray.setFromCamera(ptr, camera);
  if (ray.ray.intersectPlane(floorPlane, hit)){ if (player.seat) standUp(player); player.target.set(hit.x, 0, hit.z); clampFloor(player.target); }
});
$('btnEnter').addEventListener('click', () => {
  if (entered) return; entered = true;
  const y = player.tag.position.y; player.root.remove(player.tag); player.tag = nameTag(myId, true); player.tag.position.y = y; player.root.add(player.tag);
  $('meTag').textContent = myId; $('gate').hidden = true; $('hudTop').hidden = false; $('hudBottom').hidden = false;
  startAudio();
  avatars.forEach(a => { a.moveSince = 0; a.cool = 0; });

/* ---------- Zoom: mouse wheel, or pinch with two fingers ---------- */
let zoom = 1, pinch = 0;
const setZoom = z => { zoom = Math.max(0.55, Math.min(2, z)); };
window.addEventListener('wheel', e => { e.preventDefault(); setZoom(zoom*Math.exp(e.deltaY*0.0012)); }, {passive:false});
const touchGap = e => Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
canvas.addEventListener('touchstart', e => { if (e.touches.length === 2) pinch = touchGap(e); }, {passive:true});
canvas.addEventListener('touchmove', e => { if (e.touches.length === 2 && pinch){ const g = touchGap(e); setZoom(zoom*pinch/g); pinch = g; } }, {passive:true});
canvas.addEventListener('touchend', () => { pinch = 0; }, {passive:true});

/* ---------- Frame loop: the camera barely moves, and nothing flashes ---------- */
const camPos = new THREE.Vector3(0, 6.5, 21), camLook = new THREE.Vector3(0, 4, -8), wantPos = new THREE.Vector3(), wantLook = new THREE.Vector3(), tmpC = new THREE.Color();
let prev = performance.now(), glowHue = 0.9, lastZoom = 1;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - prev)/1000); prev = now;
  const b = beatNow(), bi = Math.floor(b);
  if (bi !== lastBeat){ lastBeat = bi; onBeat(bi); }
  const soft = (1 + Math.cos(TAU*b))/2, t = now/1000;
  keyWalk();
  netTick(now);
  applyMood(Math.floor(bi/4/MOOD_BARS) % 3, dt);
  avatars.forEach(a => animate(a, b, dt));

  rings.forEach((r, i) => { r.material.color.copy(r.userData.base).multiplyScalar((0.9 + 0.1*((i + bi) % 2 ? soft : 1 - soft))*floorDim); });
  eq.forEach((bar, i) => { const want = 0.7 + 2.3*(0.5 + 0.5*Math.sin(i*1.3 + bi*0.8)) + 0.8*soft; bar.userData.h += (want - bar.userData.h)*Math.min(1, 5*dt); bar.scale.y = bar.userData.h; bar.position.y = 1.35 + bar.userData.h/2; });
  beams.forEach((p, i) => { p.rotation.z = 0.22*Math.sin(t*0.25 + i*1.4); p.rotation.x = 0.75 + 0.1*Math.sin(t*0.2 + i); });
  glowHue = (glowHue + dt*0.01) % 1; stageGlow.color.setHSL(glowHue, 0.7, 0.7); stageGlow.intensity = 0.6 + 0.15*soft;
  wheel.rotation.z = t*0.05;
  balloons.forEach(g => { g.position.y = g.userData.y + Math.sin(t*0.25 + g.userData.ph)*1.2; });
  for (let i = 0; i < LN; i++){ let y = lanternPos[i*3+1] + dt*(0.35 + (i % 5)*0.05); if (y > 36) y = 1.5; lanternPos[i*3+1] = y; lanternPos[i*3] += Math.sin(t*0.3 + i)*dt*0.12; }
  lanternGeo.attributes.position.needsUpdate = true;

  if (placeId === 1){
    seaAnim.fish.forEach(f => { const th = f.ph + t*f.sp, sg = f.sp > 0 ? 1 : -1; f.g.position.set(Math.cos(th)*f.r, f.y + Math.sin(t*0.6 + f.ph)*0.4, Math.sin(th)*f.r - 8); f.g.rotation.y = -Math.atan2(Math.cos(th)*sg, -Math.sin(th)*sg); });
    const wth = 1 + t*0.022; whale.position.set(Math.cos(wth)*62, 17 + Math.sin(t*0.1)*1.5, Math.sin(wth)*62 - 10); whale.rotation.y = -Math.atan2(Math.cos(wth), -Math.sin(wth));
    seaAnim.jelly.forEach(j => { j.g.position.y = j.y + Math.sin(t*0.5 + j.ph)*0.8; j.g.scale.y = 1 + 0.12*Math.sin(t*1.6 + j.ph); });
    seaAnim.weed.forEach(wd => { wd.g.rotation.z = 0.16*Math.sin(t*0.7 + wd.ph); wd.g.rotation.x = 0.1*Math.sin(t*0.5 + wd.ph*2); });
    seaAnim.rays.forEach((p, i) => { p.rotation.z = 0.1*Math.sin(t*0.15 + i); });
    for (let i = 0; i < BN; i++){ let y = seaBubPos[i*3+1] + dt*(0.8 + (i % 4)*0.25); if (y > 26) y = 0; seaBubPos[i*3+1] = y; seaBubPos[i*3] += Math.sin(t + i)*dt*0.15; }
    seaBubGeo.attributes.position.needsUpdate = true;
    avatars.forEach(a => { if (Math.random() < dt*1.5){ const n = abNext++ % AB, p = a.root.position; abPos[n*3] = p.x + (Math.random() - 0.5)*0.3; abPos[n*3+1] = p.y + 1.95*a.sy + a.sq.position.y; abPos[n*3+2] = p.z + (Math.random() - 0.5)*0.3; abLife[n] = 2.6; } });
    for (let i = 0; i < AB; i++){ if (abLife[i] <= 0) continue; abLife[i] -= dt; abPos[i*3+1] += dt*1.3; abPos[i*3] += Math.sin(t*3 + i)*dt*0.2; if (abLife[i] <= 0) abPos[i*3+1] = -50; }
    abGeo.attributes.position.needsUpdate = true;
  }
  const big = groups.reduce((m, g) => (!m || g.size > m.size) ? g : m, null);
  const discWant = big ? 0.3 + 0.08*soft : 0; groupDisc.material.opacity += (discWant - groupDisc.material.opacity)*Math.min(1, 4*dt);
  if (big){ groupDisc.position.x += (big.x - groupDisc.position.x)*0.08; groupDisc.position.z += (big.z - groupDisc.position.z)*0.08; groupDisc.material.color.lerp(MOVE_COL[big.move], 0.1); }
  sparks.visible = bestTier >= 2 && !!big;
  if (sparks.visible){
    for (let i = 0; i < SN; i++){ const s = sparkSeed[i], y = (s[2] + t*s[3]) % 5; sparkPos[i*3] = big.x + Math.cos(s[0] + t*0.2)*s[1]; sparkPos[i*3+1] = 0.3 + y; sparkPos[i*3+2] = big.z + Math.sin(s[0] + t*0.2)*s[1]; }
    sparkGeo.attributes.position.needsUpdate = true;
  }
  fireworks.forEach(fw => {
    if (fw.life <= 0){ fw.p.material.opacity = 0; return; }
    const pos = fw.p.geometry.attributes.position.array, v = fw.vel, damp = 1 - 1.1*dt;
    for (let i = 0; i < FW_N*3; i += 3){ pos[i] += v[i]*dt; pos[i+1] += v[i+1]*dt; pos[i+2] += v[i+2]*dt; v[i] *= damp; v[i+1] = v[i+1]*damp - 1.2*dt; v[i+2] *= damp; }
    fw.p.geometry.attributes.position.needsUpdate = true; fw.life -= dt/2.6; fw.p.material.opacity = Math.max(0, Math.min(1, fw.life*1.6));
  });

  if (!entered || watching){ wantPos.set(Math.sin(t*0.04)*1.5, 6.5, portrait ? 30 : 24); wantLook.set(0, 4.5, -8); }
  else { const p = player.root.position; wantPos.set(p.x*0.55, 3.3, p.z + (portrait ? 13 : 8.6)); wantLook.set(p.x*0.75, 1.9, p.z - 4);
    if (zoom < 1){ const f = Math.min(1, (1 - zoom)/0.45); wantLook.x += (p.x - wantLook.x)*f; wantLook.y += (1.0 - wantLook.y)*f; wantLook.z += (p.z - wantLook.z)*f; } }
  wantPos.sub(wantLook).multiplyScalar(zoom).add(wantLook); if (wantPos.y < 1.2) wantPos.y = 1.2;
  const ck = 1 - Math.exp(-(zoom === lastZoom ? 1.6 : 6)*dt); lastZoom = zoom; camPos.lerp(wantPos, ck); camLook.lerp(wantLook, ck); camera.position.copy(camPos); camera.lookAt(camLook);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
})();
