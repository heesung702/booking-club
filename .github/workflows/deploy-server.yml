# 실시간 서버(server/)를 Cloudflare에 올립니다. main에 server/ 변경이 들어오면 자동 실행.
# 필요한 GitHub Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, STATS_KEY(통계 페이지 비밀번호)
name: Deploy server (Cloudflare)
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency: deploy-server
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Deploy
        run: npx wrangler deploy
      - name: Set stats password
        env:
          STATS_KEY: ${{ secrets.STATS_KEY }}
        run: |
          if [ -n "$STATS_KEY" ]; then printf '%s' "$STATS_KEY" | npx wrangler secret put STATS_KEY; else echo "STATS_KEY not set, skipping"; fi
